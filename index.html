<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Harf yomg‘iri — rus harflarini o‘yinda o‘rgan</title>
<style>
:root{--bg:#1b1033;--c:#2a1b4d;--c2:#4a3280;--red:#ff4d5e;--sun:#ffc93c;--mint:#35e0a1;--sky:#4cc9ff;--t:#fff8ee;--m:#b9a9e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;overflow-x:hidden}
#app{max-width:520px;margin:0 auto;padding:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
h1{font-family:Georgia,serif;font-size:2.6rem;margin:6px 0;text-align:center;line-height:1}
.c{text-align:center}.m{color:var(--m)}
.big{display:block;width:100%;background:var(--red);padding:20px;border-radius:22px;font-size:1.5rem;font-weight:bold;margin:16px 0;box-shadow:0 6px 0 #a0283a;animation:pulse 1.5s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.btn{background:var(--red);padding:14px 22px;border-radius:16px;font-weight:bold}
.btn.b{background:var(--sky);color:#102a3a}.btn.s{background:var(--c2)}
.row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.how{background:var(--c);border-radius:18px;padding:14px;line-height:1.6}
.tiles{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:8px}
.tile{aspect-ratio:1;border-radius:9px;font-family:Georgia,serif;font-size:1.15rem;background:var(--c);color:#6a5a98;padding:0}
.tile.t1{background:#6b4f12;color:var(--sun)}.tile.t2{background:var(--mint);color:#102a20}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{background:var(--c);width:40px;height:40px;border-radius:50%}
.prompt{background:var(--c);border-radius:18px;padding:8px;text-align:center;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:16px;min-height:76px}
.pe{font-size:2.8rem}.ps{font-size:2.6rem;font-weight:bold;color:var(--sun)}
#field{position:relative;height:calc(100vh - 290px);min-height:300px;background:linear-gradient(#2a1b4d,#120a26);border-radius:20px;overflow:hidden;border-bottom:4px solid var(--red)}
.fc{position:absolute;top:0;width:30%;aspect-ratio:1;border-radius:20px;font-family:Georgia,serif;font-size:3rem;background:var(--c2);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.fc.good{background:var(--mint);color:#102a20}.fc.bad{background:var(--red)}
.ov{position:absolute;inset:0;background:rgba(27,16,51,.96);display:flex;align-items:center;justify-content:center;padding:8px;overflow:auto;animation:pop .3s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.huge{font-family:Georgia,serif;font-size:4.6rem;line-height:1.1}
.snd{color:var(--sky);font-size:1.3rem}.emo{font-size:3.4rem}
.tip{background:rgba(0,0,0,.3);border-radius:12px;padding:8px;margin:8px 0;line-height:1.4}
.fb{margin-top:10px;padding:10px;border-radius:14px;text-align:center;line-height:1.5}
.fb.g{background:rgba(53,224,161,.2)}.fb.b{background:rgba(255,77,94,.25)}
.splash{display:flex;align-items:center;justify-content:center;min-height:80vh}
.splash{flex-direction:column;gap:18px}
.splash .big{max-width:320px}
.camel{width:190px;animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

function akey(t){return String(t).replace(/<[^>]*>/g,'').toLowerCase().replace(/[.,!?;:«»"“”…()–—]/g,' ').replace(/\s+/g,' ').trim();}
function unlockClip(){try{AUe=new Audio();AUe.src=SILC;var p=AUe.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}
function playClip(t,done){
  var d=AUDIO[akey(t)];if(!d)return false;
  try{if(!AUe)AUe=new Audio();AUe.onended=done||null;AUe.src=d;var p=AUe.play();if(p&&p.catch)p.catch(function(){});return true;}catch(e){return false;}

let AC=null,GID=0,VOICES=[],SOUND=false,SID=0;

function ctx(){
 try{
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}
  if(AC&&AC.state==='suspended')AC.resume();
 }catch(e){}
 return AC;
}
function loadV(){try{VOICES=speechSynthesis.getVoices()}catch(e){}}
try{loadV();speechSynthesis.onvoiceschanged=loadV}catch(e){}

function say(t,r){
 if(!SOUND)return;
 if(playClip(t))return;
 const id=++SID;
 const v=VOICES.find(x=>/^ru/i.test(x.lang));
 if(!v||!('speechSynthesis' in window))return;
 let started=false;
 const u=new SpeechSynthesisUtterance(t);
 u.lang='ru-RU';u.voice=v;u.rate=r||.85;
 u.onstart=()=>{started=true};
 
 window._u=u;
 try{speechSynthesis.cancel()}catch(e){}
 setTimeout(()=>{try{speechSynthesis.speak(u)}catch(e){}},80);
}
function beep(ok){
 if(!SOUND)return;
 try{
  const c=ctx();if(!c)return;
  const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
  o.connect(g);g.connect(c.destination);o.type='triangle';o.frequency.value=ok?880:170;
  g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);
  o.start(t);o.stop(t+.25);
 }catch(e){}
}

  app.innerHTML=`<div class=c><h1>${nb?'🏆 Yangi rekord!':'O‘yin tugadi'}</h1><p style="font-size:1.4rem">⭐ ${score} ball · 🔥 ${hits} ta to‘g‘ri</p><p class=m>Ochilgan harflar: ${S.u}/${L.length}</p><p class=m>💪 Alifbo biroz zerikarli, lekin keyingi darslar oson va juda qiziqarli bo‘ladi!</p>${tiles()}<div class=row><button class=btn onclick="game()">🔁 Yana o‘ynash</button><button class="btn s" onclick="home()">Menyu</button></div></div>`;
 }
 nx();
}
